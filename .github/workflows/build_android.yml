name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # 项目 README 与桌面 workflow 都要求 Flutter 3.47.5 / Dart 3.10。
  # 固定版本而不是 channel: stable，避免 Flutter 升级后 Gradle/AGP 漂移。
  FLUTTER_VERSION: "3.47.5"
  # Flutter 3.47.5 默认值，同时也是 mpv_audio_kit 锁定的要求：
  #   android/build.gradle.kts -> compileSdk 36 / minSdk 24 / ndkVersion 28.2.13676358
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.22.1"
  # 分别构建 64 位与 32 位单 ABI APK；每轮只编译一个 target-platform，
  # 避免 Rust/cargokit 与 libmpv 下载任务在多 ABI 下互相覆盖产物。
  # 正式签名所需的 4 个 secrets；未配置时保持 Flutter 模板的 debug 签名。
  SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
            artifact: myune-music-android-arm64
          - abi: armeabi-v7a
            target: android-arm
            artifact: myune-music-android-armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Gradle 9.3 / AGP 9.1)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      # ubuntu-latest 已预装 Android SDK 与 cmdline-tools。
      # 不用 setup-android@v3：它默认仍安装已废弃的 "tools" 包，会直接报错退出。
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # Android NDK 自带 clang/CMake；runner 镜像也预装 libclang。
      # 不做 apt-get，避免镜像源阻塞整个构建。
      - name: Print toolchain versions
        run: |
          flutter --version
          rustc --version
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -30

      - name: Flutter pub get
        run: flutter pub get

      # 上游是桌面项目，仓库里没有 android/；在 CI 里生成固定 applicationId 的 runner。
      # Flutter 3.47.5 的 create 会无条件重写 pubspec.lock 为只含 SDK 依赖的空壳，
      # 因此先备份并在 runner 生成后恢复，随后重新 pub get 校验完整依赖树。
      - name: Generate Android runner (if missing)
        run: |
          cp pubspec.lock pubspec.lock.bak
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.midihl \
              --project-name myune_music_android \
              --android-language kotlin \
              --no-pub .
          fi
          mv pubspec.lock.bak pubspec.lock
          # 注入 SAF / ContentResolver 原生通道（目录树选择、持久权限、递归音频枚举）。
          mkdir -p android/app/src/main/kotlin/com/midihl/myune_music_android
          cp ci/MainActivity.kt \
            android/app/src/main/kotlin/com/midihl/myune_music_android/MainActivity.kt
          # file_picker 等旧插件的 Kotlin JVM target 与 Java target 不一致；
          # KGP 2.4 默认把它升级为 error，降级为 warning 以保留现有依赖树。
          printf '\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties
          flutter pub get
          test -f android/app/build.gradle.kts
          grep -F "xiaobaimc/mpv_audio_kit.git" pubspec.lock
          grep -F "e87688132c2fc1b0960877a59a7b5a535b64917a" pubspec.lock
          grep -F "kotlin.jvm.target.validation.mode=warning" android/gradle.properties

      # file_picker 10.2.0 的 Groovy 脚本写死 compileSdk 34，但它依赖的
      # AndroidX / lifecycle 2.0.28 的 AAR metadata 要求 compileSdk >= 36。
      # 只改 pub cache 中该插件的构建脚本，不动 Dart 依赖树。
      - name: Align legacy plugin compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          pub_cache = os.environ.get("PUB_CACHE") or str(Path.home() / ".pub-cache")
          candidates = list(Path(pub_cache).glob("hosted/*/file_picker-*/android/build.gradle"))
          if not candidates:
              raise SystemExit("file_picker android/build.gradle not found in pub cache")

          for gradle in candidates:
              text = gradle.read_text(encoding="utf-8")
              patched = text.replace(
                  "compileSdk 34",
                  "compileSdk ${ANDROID_COMPILE_SDK}",
              )
              if patched != text:
                  # Gradle 需要 single/double quoted string 才能做环境变量插值。
                  patched = patched.replace(
                      "compileSdk ${ANDROID_COMPILE_SDK}",
                      'compileSdk System.getenv("ANDROID_COMPILE_SDK") as int',
                  )
                  gradle.write_text(patched, encoding="utf-8")
                  print(f"patched {gradle}")
              else:
                  print(f"no hardcoded compileSdk 34 in {gradle}")
          PY

      # mpv_audio_kit 的 Manifest 已带 FOREGROUND_SERVICE / POST_NOTIFICATIONS，
      # 这里补 INTERNET，并注入 Android TV 桌面入口（LEANBACK_LAUNCHER、
      # uses-feature 与 320x180 banner）。同一 APK 同时支持手机与电视。
      - name: Patch AndroidManifest permissions and TV launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          def manifest_open_end(source):
              start = source.find("<manifest")
              end = source.find(">", start)
              if start < 0 or end < 0:
                  raise SystemExit("cannot locate <manifest ...> opening tag")
              return end

          if "android.permission.INTERNET" not in text:
              end = manifest_open_end(text)
              permission = '\n    <uses-permission android:name="android.permission.INTERNET"/>'
              text = text[: end + 1] + permission + text[end + 1 :]
              print("injected android.permission.INTERNET")
          else:
              print("android.permission.INTERNET already present")

          # 触摸屏 / leanback / gamepad 都声明为可选，保证同一 APK 在
          # 手机与 Android TV 上都能安装。
          features = (
              "android.software.leanback",
              "android.hardware.touchscreen",
              "android.hardware.gamepad",
          )
          missing = [f for f in features if 'android:name="%s"' % f not in text]
          if missing:
              end = manifest_open_end(text)
              block = "".join(
                  '\n    <uses-feature android:name="%s" android:required="false"/>' % f
                  for f in missing
              )
              text = text[: end + 1] + block + text[end + 1 :]
              print("injected uses-feature: %s" % ", ".join(missing))

          if "android.intent.category.LEANBACK_LAUNCHER" not in text:
              leanback = (
                  '\n                <category '
                  'android:name="android.intent.category.LEANBACK_LAUNCHER"/>'
              )
              anchor = 'android.intent.category.LAUNCHER"'
              idx = text.find(anchor)
              tag_end = text.find("/>", idx) if idx >= 0 else -1
              if tag_end >= 0:
                  text = text[: tag_end + 2] + leanback + text[tag_end + 2 :]
              else:
                  # 模板若没有 LAUNCHER category，退回到第一个 intent-filter 内。
                  filter_end = text.find("</intent-filter>")
                  if filter_end < 0:
                      raise SystemExit("cannot locate intent-filter for TV launcher")
                  text = text[:filter_end] + leanback + "\n            " + text[filter_end:]
              print("injected LEANBACK_LAUNCHER category")

          if "android:banner=" not in text:
              app_start = text.find("<application")
              if app_start < 0:
                  raise SystemExit("cannot locate <application> tag")
              app_end = text.find(">", app_start)
              if app_end < 0:
                  raise SystemExit("cannot locate end of <application> tag")
              text = (
                  text[:app_end]
                  + '\n        android:banner="@drawable/tv_banner"'
                  + text[app_end:]
              )
              print("injected android:banner")

          manifest.write_text(text, encoding="utf-8")

          final = manifest.read_text(encoding="utf-8")
          for token in (
              "android.permission.INTERNET",
              "android.software.leanback",
              "android.hardware.touchscreen",
              "android.intent.category.LEANBACK_LAUNCHER",
              "android:banner=",
          ):
              if token not in final:
                  raise SystemExit("TV manifest patch incomplete: missing " + token)

          # 320x180 xhdpi TV banner：仅用标准库生成 PNG，不引入图片工具。
          W, H = 320, 180
          rows = []
          for y in range(H):
              row = bytearray(b"\x00")
              for x in range(W):
                  t = x / (W - 1)
                  r = int(18 + 30 * t)
                  g = int(24 + 46 * t)
                  b = int(38 + 72 * t)
                  dx = x - W / 2
                  dy = y - H / 2
                  d = (dx * dx + dy * dy) ** 0.5
                  if 42 <= d <= 48:
                      r, g, b = 235, 240, 250
                  if -14 <= dx <= 16 and abs(dy) <= 14 and dx <= 16 - abs(dy):
                      r, g, b = 235, 240, 250
                  row += bytes((r, g, b))
              rows.append(bytes(row))

          def chunk(tag, data):
              return (
                  struct.pack(">I", len(data))
                  + tag
                  + data
                  + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
              + chunk(b"IEND", b"")
          )
          banner_dir = Path("android/app/src/main/res/drawable-xhdpi")
          banner_dir.mkdir(parents=True, exist_ok=True)
          banner_path = banner_dir / "tv_banner.png"
          banner_path.write_bytes(png)
          print("generated %s (%d bytes)" % (banner_path, len(png)))
          PY

      # 可选正式签名：4 个 secrets 齐全时切换 release signingConfig；
      # 任一缺失则完全不动 runner，保留模板的 debug 签名用于本轮真机测试。
      - name: Configure release signing (optional)
        run: |
          set -e
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || \
             [ -z "$SIGNING_KEY_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "Release signing secrets not configured; keeping debug signing."
            exit 0
          fi
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          python3 - <<'PY'
          import os
          from pathlib import Path

          def esc(value):
              for old, new in (("\\", "\\\\"), (":", "\\:"), ("=", "\\="),
                               ("#", "\\#"), ("!", "\\!")):
                  value = value.replace(old, new)
              return value

          values = {
              "storeFile": "upload-keystore.jks",
              "storePassword": os.environ["SIGNING_STORE_PASSWORD"],
              "keyPassword": os.environ["SIGNING_KEY_PASSWORD"],
              "keyAlias": os.environ["SIGNING_KEY_ALIAS"],
          }
          Path("android/key.properties").write_text(
              "".join(f"{k}={esc(v)}\n" for k, v in values.items()),
              encoding="utf-8",
          )

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          if "android-port:signing" in text:
              raise SystemExit("signing config already patched")

          imports = (
              "// android-port:signing\n"
              "import java.util.Properties\n"
              "import java.io.FileInputStream\n\n"
          )
          keystore_block = (
              'val keystoreProperties = Properties().apply {\n'
              '    val propertiesFile = rootProject.file("key.properties")\n'
              '    if (propertiesFile.exists()) {\n'
              '        FileInputStream(propertiesFile).use { load(it) }\n'
              '    }\n'
              '}\n\n'
          )
          signing_configs = (
              '    signingConfigs {\n'
              '        create("release") {\n'
              '            storeFile = file(keystoreProperties.getProperty("storeFile"))\n'
              '            storePassword = keystoreProperties.getProperty("storePassword")\n'
              '            keyAlias = keystoreProperties.getProperty("keyAlias")\n'
              '            keyPassword = keystoreProperties.getProperty("keyPassword")\n'
              '        }\n'
              '    }\n'
          )

          anchor = "\nandroid {"
          if anchor not in text:
              raise SystemExit("cannot locate android { block")
          text = imports + text
          index = text.index(anchor)
          text = text[:index] + "\n" + keystore_block + text[index:]
          text = text.replace(anchor, anchor + "\n" + signing_configs, 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )
          gradle.write_text(text, encoding="utf-8")
          print("release signingConfig enabled")
          PY

      - name: Build APK (${{ matrix.abi }}, release)
        run: |
          flutter build apk --release --target-platform "${{ matrix.target }}"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          mv "$apk" "build/app/outputs/flutter-apk/myune-music-${{ matrix.abi }}-release.apk"

      - name: Inspect APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          sha256sum build/app/outputs/flutter-apk/*.apk
          apksigner="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$apksigner" verify --print-certs "$apk" | head -12 || true
            unzip -l "$apk" | grep -F "lib/${{ matrix.abi }}/libmpv.so"
            unzip -l "$apk" | grep -F "lib/${{ matrix.abi }}/librust_lib_myune_music.so"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
